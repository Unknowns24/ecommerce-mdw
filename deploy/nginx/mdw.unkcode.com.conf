# Reverse proxy de Nginx para mdw.unkcode.com (ADR-005 y ADR-007). Nginx corre
# en el host de la VPS, no en el compose: /api/ va al contenedor de la API y
# todo lo demás al del frontend, bajo el mismo dominio. Así la cookie `sesion`
# vale para los dos y Mercado Pago vuelve a /pago/retorno en el mismo sitio.
#
# Instalación en la VPS:
#   sudo cp deploy/nginx/mdw.unkcode.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/mdw.unkcode.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo certbot --nginx -d mdw.unkcode.com
# certbot agrega el bloque `listen 443 ssl` y la redirección de 80 a 443 sobre
# este mismo archivo, con el certificado que ya tenga emitido.

server {
    listen 80;
    server_name mdw.unkcode.com;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # API de Go, incluido el webhook de Mercado Pago (/api/pagos/webhook). Sin
    # URI en proxy_pass, la ruta y la query llegan tal cual (`?data.id=` es
    # parte de lo que Mercado Pago firma), y los headers x-signature y
    # x-request-id pasan sin tocarse.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # Frontend en Next.js: tienda, cuenta y panel.
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
