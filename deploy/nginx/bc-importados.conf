# Reverse proxy de Nginx hacia el contenedor de la API, con TLS vía
# Let's Encrypt (certbot). Se instala en la VPS en
# /etc/nginx/sites-available/bc-importados.conf y se habilita con
# `ln -s` a sites-enabled. Reemplazá api.tu-dominio.com por el dominio real
# antes de correr certbot --nginx.

server {
    listen 80;
    server_name api.tu-dominio.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# `certbot --nginx -d api.tu-dominio.com` agrega automáticamente el bloque
# `listen 443 ssl` y el redirect de 80 a 443 sobre este mismo archivo.
