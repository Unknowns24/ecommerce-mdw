# En la VPS, Watchtower actualiza api y web cuando cambia su imagen :latest
# en GHCR (ADR-005). En local, `docker compose up -d --build` las construye
# desde el código y les pone ese mismo nombre.
services:
  api:
    image: ghcr.io/unknowns24/ecommerce-mdw/backend:latest
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Frontend en Next.js (ADR-007). Llama a la API por la red interna de
  # compose, sin salir a internet. Publica solo en 127.0.0.1: desde afuera se
  # entra por Nginx (deploy/nginx/).
  web:
    image: ghcr.io/unknowns24/ecommerce-mdw/frontend:latest
    build: ./frontend
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
